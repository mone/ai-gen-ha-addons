name: Add-on CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  lint:
    name: Lint add-on metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run Home Assistant add-on linter
        uses: frenck/action-addon-lint@v2
        with:
          target: ./gluetun

  test:
    name: Run repository tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install --upgrade pip pytest pyyaml
      - name: Run pytest
        run: pytest

  build:
    name: Build add-on image
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build add-on (amd64)
        uses: docker/build-push-action@v5
        with:
          context: ./gluetun
          platforms: linux/amd64
          load: true
          push: false
          tags: local/gluetun:ci
